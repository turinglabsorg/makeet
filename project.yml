name: Avvi
options:
  developmentLanguage: it
  bundleIdPrefix: org.turinglabs.avvi
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Avvi
    INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Avvi usa i calendari scelti per proporti orari liberi e aggiungere solo i blocchi che confermi.
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
targets:
  Avvi:
    type: application
    platform: iOS
    sources: [App, Core, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turinglabs.avvi
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: Config/iOS-Info.plist
      properties:
        CloudSyncEnabled: false
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: org.turinglabs.avvi
            CFBundleURLSchemes: [avvi]
    entitlements:
      path: Config/iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.org.turinglabs.avvi]
    dependencies:
      - target: AvviWidget
  AvviWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Core, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turinglabs.avvi.widget
        SKIP_INSTALL: YES
    info:
      path: Config/iOS-Widget-Info.plist
      properties:
        CloudSyncEnabled: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/iOS-Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.org.turinglabs.avvi]
  AvviMac:
    type: application
    platform: macOS
    sources: [App, Core, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turinglabs.avvi.mac
        ENABLE_APP_SANDBOX: YES
    info:
      path: Config/macOS-Info.plist
      properties:
        CloudSyncEnabled: false
        CFBundleURLTypes:
          - CFBundleURLName: org.turinglabs.avvi
            CFBundleURLSchemes: [avvi]
    entitlements:
      path: Config/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.application-groups: [group.org.turinglabs.avvi]
    dependencies:
      - target: AvviMacWidget
  AvviMacWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Core, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turinglabs.avvi.mac.widget
        SKIP_INSTALL: YES
        ENABLE_APP_SANDBOX: YES
    info:
      path: Config/macOS-Widget-Info.plist
      properties:
        CloudSyncEnabled: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/macOS-Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [group.org.turinglabs.avvi]
  AvviCalendarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CalendarTests]
    dependencies:
      - target: Avvi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turinglabs.avvi.calendartests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Avvi.app/Avvi
        BUNDLE_LOADER: $(TEST_HOST)
  AvviUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Avvi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turinglabs.avvi.uitests
        TEST_TARGET_NAME: Avvi
schemes:
  Avvi:
    test:
      targets: [AvviUITests, AvviCalendarTests]
    build:
      targets:
        Avvi: all
    run:
      config: Debug
  AvviMac:
    build:
      targets:
        AvviMac: all
    run:
      config: Debug
