name: Makeet
options:
  developmentLanguage: it
  knownRegions: [it, en, fr, de, es, Base]
  bundleIdPrefix: org.turinglabs.makeet
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.1.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 6
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Makeet
    INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Makeet usa i calendari scelti per proporti orari liberi e aggiungere solo i blocchi che confermi.
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
  configs:
    Debug:
      MAKEET_APNS_ENVIRONMENT: development
    Release:
      MAKEET_APNS_ENVIRONMENT: production
targets:
  Makeet:
    type: application
    platform: iOS
    sources: [App, Accounts, Core, Shared, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turinglabs.makeet
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: Config/iOS-Info.plist
      properties:
        CloudSyncEnabled: false
        GIDClientID: 731972856977-2se8bn3c40ad9lvkbg5didlo2i8vc77n.apps.googleusercontent.com
        GIDServerClientID: 731972856977-opcdpeclv1bs9raeuru6oton77ifig4r.apps.googleusercontent.com
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: org.turinglabs.makeet
            CFBundleURLSchemes: [makeet, com.googleusercontent.apps.731972856977-2se8bn3c40ad9lvkbg5didlo2i8vc77n]
    entitlements:
      path: Config/iOS.entitlements
      properties:
        aps-environment: $(MAKEET_APNS_ENVIRONMENT)
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: [group.org.turinglabs.makeet]
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: MakeetWidget
  MakeetWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Core, Shared, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turinglabs.makeet.widget
        SKIP_INSTALL: YES
    info:
      path: Config/iOS-Widget-Info.plist
      properties:
        CloudSyncEnabled: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/iOS-Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.org.turinglabs.makeet]
  MakeetMac:
    type: application
    platform: macOS
    sources: [App, Accounts, Core, Shared, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turinglabs.makeet.mac
        ENABLE_APP_SANDBOX: YES
    info:
      path: Config/macOS-Info.plist
      properties:
        CloudSyncEnabled: false
        GIDClientID: 731972856977-v8qqgo8u1fu4cp5g2c2sqqan7jb1jurb.apps.googleusercontent.com
        GIDServerClientID: 731972856977-opcdpeclv1bs9raeuru6oton77ifig4r.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLName: org.turinglabs.makeet
            CFBundleURLSchemes: [makeet, com.googleusercontent.apps.731972856977-v8qqgo8u1fu4cp5g2c2sqqan7jb1jurb]
    entitlements:
      path: Config/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.aps-environment: $(MAKEET_APNS_ENVIRONMENT)
        com.apple.developer.applesignin: [Default]
        com.apple.security.personal-information.calendars: true
        keychain-access-groups: [$(AppIdentifierPrefix)$(CFBundleIdentifier)]
        com.apple.security.application-groups: [group.org.turinglabs.makeet]
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: MakeetMacWidget
  MakeetMacWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Core, Shared, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turinglabs.makeet.mac.widget
        SKIP_INSTALL: YES
        ENABLE_APP_SANDBOX: YES
    info:
      path: Config/macOS-Widget-Info.plist
      properties:
        CloudSyncEnabled: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/macOS-Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [group.org.turinglabs.makeet]
  MakeetCalendarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CalendarTests]
    dependencies:
      - target: Makeet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turinglabs.makeet.calendartests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Makeet.app/Makeet
        BUNDLE_LOADER: $(TEST_HOST)
  MakeetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Makeet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.turinglabs.makeet.uitests
        TEST_TARGET_NAME: Makeet
schemes:
  Makeet:
    test:
      targets: [MakeetUITests, MakeetCalendarTests]
      commandLineArguments:
        --ui-testing: true
    build:
      targets:
        Makeet: all
    run:
      config: Debug
  MakeetMac:
    build:
      targets:
        MakeetMac: all
    run:
      config: Debug
