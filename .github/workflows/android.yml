name: Android
on:
  pull_request:
    paths: ['android/**', 'Resources/Localizable.xcstrings', 'PlayStore/**', 'scripts/ValidatePlayStore.py', 'scripts/*Android*', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', 'Resources/Localizable.xcstrings', 'PlayStore/**', 'scripts/ValidatePlayStore.py', 'scripts/*Android*', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            arch: x86
          - api: 36
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate localized resources
        run: python3 scripts/GenerateAndroidStrings.py --check
      - name: Validate actual Play listing assets
        run: python3 scripts/ValidatePlayStore.py
      - name: Unit tests, lint and unsigned release audit build
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:bundleRelease :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Validate the actual bundle
        run: |
          mkdir -p artifacts/android
          curl --fail --silent --show-error --location https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o artifacts/android/bundletool.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  artifacts/android/bundletool.jar' | sha256sum --check
          python3 scripts/AuditAndroidBundle.py --bundle android/app/build/outputs/bundle/release/app-release.aab --bundletool artifacts/android/bundletool.jar > artifacts/android/bundle-audit.json
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Native UI, profile and calendar tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: ${{ matrix.arch }}
          profile: pixel_7
          disable-animations: true
          script: python3 scripts/RunAndroidTests.py --serial emulator-5554
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-api-${{ matrix.api }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            artifacts/android/runtime/
            artifacts/android/bundle-audit.json
          retention-days: 14
